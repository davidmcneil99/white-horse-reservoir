<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}White Horse Reservoir{% endblock %}</title>
  <link rel="stylesheet" href="/white-horse-reservoir/assets/style.css">
  {% block extra_head %}{% endblock %}
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a href="/white-horse-reservoir/" class="site-title">White Horse Reservoir</a>
      <button class="nav-toggle-btn" aria-expanded="false" aria-controls="site-nav" aria-label="Toggle navigation">
        <span></span><span></span><span></span>
      </button>
      <nav class="site-nav" id="site-nav" aria-label="Main navigation">
        <ul>
          <li><a href="/white-horse-reservoir/">Home</a></li>
          <li><a href="/white-horse-reservoir/facts.html">Facts</a></li>
          <li><a href="/white-horse-reservoir/actions.html">Actions</a></li>
          <li><a href="/white-horse-reservoir/letters.html">Letters</a></li>
          <li><a href="/white-horse-reservoir/about.html">About</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main class="container">
    {% block content %}{% endblock %}
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>Built by volunteers in support of GARD's campaign. Independent of GARD. Last updated: {{ built_on }}.</p>
    </div>
  </footer>

  <script src="/white-horse-reservoir/assets/lookup.js" defer></script>
  <script src="/white-horse-reservoir/assets/letters.js" defer></script>
  <script src="/white-horse-reservoir/assets/map.js" defer></script>
  {% block extra_scripts %}{% endblock %}
  <script>
    (function () {
      var btn = document.querySelector('.nav-toggle-btn');
      var nav = document.getElementById('site-nav');
      if (btn && nav) {
        btn.addEventListener('click', function () {
          var open = nav.classList.toggle('is-open');
          btn.setAttribute('aria-expanded', open ? 'true' : 'false');
        });
      }
    }());
  </script>
</body>
</html>
